skill_id: derivative_intro_via_slope_limit_v1
name: 导数概念引入：从割线斜率到极限定义
version: '1.0'
trigger:
- 学生首次接触导数概念，需要从已有的一次函数斜率知识过渡到曲线切线斜率
- 学生能计算割线斜率，但无法理解切线斜率与极限的关系
- 课程进入微分学起始章节，需要建立导数定义的直观基础
preconditions:
- 学生已掌握一次函数斜率公式 m = Δy/Δx
- 学生已了解极限的基本概念（如 h 趋近于 0 的含义）
- 学生具备基本的函数图像和坐标几何知识
goal:
- 学生能用自己的语言解释导数是割线斜率的极限
- 学生能写出导数定义式 f'(x) = lim(h→0) [f(x+h)-f(x)]/h 并说明各符号含义
- 学生能判断导数存在的条件：极限必须存在
procedure:
- 复习一次函数斜率：提问学生一次函数斜率的公式，确认 m = Δy/Δx = (y2-y1)/(x2-x1)
- 引入变量替换：将 x2 改写为 x1+h，演示斜率公式变为 [f(x1+h)-f(x1)]/h，并解释 h 表示两点间水平距离
- 提出问题情境：询问学生'如果函数不是直线而是曲线，斜率该如何求？'，引导学生意识到直线斜率公式不适用
- 几何演示：在曲线上取两点作割线，通过图形展示割线斜率与曲线在某点处斜率的差距，并说明两点越近差距越小
- 引导极限思考：提示学生'当 h 趋近于 0 时，割线会变成什么？'，引导学生发现割线转化为切线，斜率趋近于一个确定值
- 形式化定义：给出导数定义 f'(x) = lim(h→0) [f(x+h)-f(x)]/h，并强调导数存在的前提是极限必须存在，否则导数不存在
teacher_actions:
- ask
- explain
- demonstrate
- scaffold
- prompt
- contrast
- summarize
student_signals:
- 学生能正确回忆并写出一次函数斜率公式
- 学生能理解 x2 改写为 x1+h 的变量替换，并能解释 h 的几何意义
- 学生能主动说出'当 h 趋近于 0 时割线变成切线'这一关键结论
- 学生能区分导数存在（极限存在）与不存在（极限不存在）的情形
failure_modes:
- 学生对极限概念掌握不牢，无法理解 h 趋近于 0 时割线斜率趋近于某个确定值，导致导数定义的核心难以把握
- 变量替换步骤讲解过快，学生跟不上从 x2 到 x1+h 的改写逻辑，后续公式推导断裂
- 学生缺乏空间想象能力，难以通过几何图形理解割线逐渐变为切线的过程，直观理解受阻
verification:
- 提问学生'导数的本质是什么'，检查学生能否回答'割线斜率的极限'而非仅背诵公式
- 给出一个具体函数（如 f(x)=x²），让学生写出在 x=1 处的导数定义式并计算，检验公式应用能力
- 提问'如果极限不存在，导数存在吗？'，检查学生是否理解导数存在的条件
