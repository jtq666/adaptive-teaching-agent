teaching_strategies:
- 类比或具体例子：用一次函数斜率的已知知识类比到曲线斜率
- 逐步拆解：从一次函数斜率公式逐步推导到导数定义
- 提问与等待：多次向学生提问引导思考（如'你们觉得会发生什么结果？'）
- 先直觉后形式化：先通过几何直观理解切线斜率，再给出形式化的导数定义
- 知识回顾与间隔复习：回顾初中一次函数斜率知识作为铺垫
- 苏格拉底式追问：通过连续追问引导学生自己发现极限思想
