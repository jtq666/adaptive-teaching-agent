skill_id: variable_upper_limit_integration_v1
name: 变上限积分求导的五种情形与统一公式
version: '1.0'
trigger:
- 学生初次接触【记忆】学生能记住上
- 学生对【记忆】学生能记住上感到困惑或难以理解
preconditions:
- 学生已掌握相关前置知识
- 学生具备基本的【记忆】学生能记住上相关概念
goal:
- 【记忆】学生能记住上下限均为函数（含上下限均为函数）的复合积分统一公式：F(φ(b))·φ'(b) − F(ψ(a))·ψ'(a)
- 【理解】学生能借助已知的"牛顿莱布尼茨公式 F(b)-F(a)"这一原形，类比推导复合函数作为积分限时的公式，理解"先代内再乘内层导数"的构造逻辑
- 【应用】学生能将公式应用于1-4已学情况，建立统一的记忆与解题框架，实现知识整合
- 【理解】理解上下限函数项中"内层求导再乘外层求导"（链式法则）的结构，特别是负函数作为内层时的负号来源
procedure:
- 回顾目标：明确本节要记忆的是"上下限均为函数"的情况五公式
- 呈现原形：写出牛顿莱布尼茨公式 F(b)−F(a) 作为记忆锚点
- 代入复合：将上限 b 替换为上限函数 φ(b)、下限 a 替换为下限函数 ψ(a)
- 补乘导数项：对上限一侧补乘 φ'(b)（上限导数），对下限一侧补乘 ψ'(a)（下限导数）
- 逐项展开：把"大F(fx)"按链式法则写成 F'(fx)·φ'(b)，把负号对应到下限项的内层负函数上
- 统一总结：强调前4种情况都可以用本统一公式来记忆，整合分散公式
teacher_actions:
- explain（讲解情况五的公式结构）
- demonstrate（演示从牛顿莱布尼茨公式到情况五的等价变形）
- summarize（总结指出1-4情况也可借助情况五这一统一形式来记忆）
student_signals:
- 学生能够复述"上限往里带乘上限导数 — 减号 — 下限往里带乘下限导数"的口诀
- 学生在已知1-4情况公式的基础上，能否将该统一形式自然地推导/迁移出来
- 学生能否将公式右侧的两项正确展开为大F复合求导的形式（包括内层负函数的求导）
failure_modes:
- 讲解节奏过快、信息密度过大，学生来不及消化过程
- 使用牛顿莱布尼茨公式作为类比需要学生先掌握该公式，若学生前置知识薄弱则类比失效
- 在已有1-4情况的教学基础上跳跃到情况五的综合形式，缺少针对情况五独立的直观引入
- 口语化表达中夹杂较多省略和重复（如"fx""fpsix"读音含糊），学生可能听不清符号对应关系
- 只强调"记忆"而未配套练习与变式应用，学生容易考场上遗忘或混淆四项的符号/位置
verification:
- 请学生用自己的话解释【记忆】学生能记住上
- 出一道相关的应用题检验理解
- 设计一道记忆层级的问题
source_video: '变上限积分，求导方法 #高等数学.mp4'
source_course: 高等数学
source_timestamp: 整节
bloom_category: 记忆
teaching_strategies:
- 类比或具体例子：将复合限积分统一公式类比为已学过的牛顿莱布尼茨公式 F(b)−F(a)，作为记忆锚点
- 先整体后局部：先给出统一公式的整体结构，再逐项分解（上限项 / 下限项 / 各自的导数项）
- 总结与迁移：明确指出1-4种情况都可借助情况五这一统一形式记忆，实现已有知识的迁移整合
- 符号公式逐行解释：教师带读每个位置的符号含义（"上限往里带""上限导数""再对内层求导"），强化对应关系
