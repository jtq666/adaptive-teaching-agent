skill_id: intro_derivative_via_instantaneous_velocity_v1
name: 通过瞬时速度引入导数概念
version: '1.0'
bloom_category: 理解
trigger:
- 初次讲解导数概念时，需要建立物理直觉
- 学生已学过平均速度但对极限思想不熟悉
- 需要从生活化情境过渡到抽象数学概念
preconditions:
- 学生已知平均速度的计算方法
- 学生具备基本的函数与变化率概念
- 教师准备好生活化的运动场景作为例子
goal:
- 理解平均速度与瞬时速度的本质区别
- 通过物理情境建立极限思想的直观认识
- 理解导数的物理来源——瞬时变化率即为导数
procedure:
- 提出具体情境：开车从A地到B地，距离100公里，用时2小时
- 计算平均速度：用总位移除以总时间，得出50公里/小时，建立已知概念基础
- 引入对比：指出速度表显示的是瞬时速度，与平均速度不同，激发认知冲突
- 引导提问：抛出"瞬时速度怎么求"的问题，激发学生思考
- 引入核心思想：说明"让时间间隔趋近于零"即为极限思想
- 建立联系：将极限思想与导数概念关联，得出导数即为瞬时变化率
teacher_actions:
- explain
- demonstrate
- contrast
- prompt
- guide
student_signals:
- 学生能复述平均速度与瞬时速度的区别
- 学生能用"时间间隔趋近于零"这一思想解释其他瞬时变化率问题，如瞬时加速度
- 学生能将物理情境转化为数学表达式，即Δt→0时Δs/Δt的极限
failure_modes:
- 例子过于简化：仅用一句话带过"时间间隔趋近于零"，未给出具体的数学表达式 Δs/Δt → ds/dt
- 缺乏数学形式化：从物理例子直接跳到导数概念，对数学基础薄弱的学生造成认知跳跃
- 缺乏检查环节：未给出提问或练习机会，无法确认学生是否真正理解平均与瞬时的差异
verification:
- 提问检验：让学生复述平均速度与瞬时速度的区别
- 迁移测试：让学生用极限思想解释瞬时加速度等其他瞬时变化率
- 符号化测试：让学生写出Δt→0时Δs/Δt的极限表达式
source_video: 徐小湛《高等数学》第20讲 导数的概念 1.mp4
source_course: 高等数学
teaching_strategies:
- 类比或具体例子：以开车场景作为生活化例子
- 对比学习：将平均速度与瞬时速度进行对比
- 先直觉后形式化：先建立物理直觉（开车、速度表），再引出数学概念（导数）
- 先整体后局部：先呈现完整的运动过程，再聚焦到某一瞬间的瞬时速度
- 苏格拉底式追问：通过"瞬时速度怎么求"的问题引发思考
courses: [高等数学]
topic_tags: [导数, 瞬时速度, 平均速度, 极限, 变化率]
trigger_states: [initial, followup, confusion, misconception]
required_prior_knowledge: [斜率, 平均速度, 函数]
