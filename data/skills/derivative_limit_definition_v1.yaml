skill_id: derivative_limit_definition_v1
name: 从物理情境理解导数的极限定义
version: '1.0'
trigger:
- 讲授高等数学导数章节，学生第一次接触导数的形式化数学定义时
- 学生已理解平均变化率，但无法从极限角度理解瞬时变化率时
- 需要从物理直觉（瞬时速度）过渡到严格数学定义（极限）的教学环节
preconditions:
- 学生已掌握函数和平均变化率（Δy/Δx）的基本概念
- 学生已初步了解极限思想，能理解"趋近于零"的直觉含义
goal:
- 理解导数的极限定义及其物理来源（瞬时速度）（布鲁姆层级：理解）
- 能运用极限定义计算具体函数的导数（布鲁姆层级：应用）
- 理解导数的几何意义——函数曲线在某点切线的斜率（布鲁姆层级：理解）
- 体会"以极限刻画瞬时变化"的核心数学思想（布鲁姆层级：分析）
procedure:
- 引入物理情境：以自由落体小球为例，提出求瞬时速度的问题
- 计算平均速度：位移除以时间，建立初步直观
- 让时间间隔趋近于零，使平均速度逼近瞬时速度（极限思想的渗透）
- 用数学语言形式化：将过程抽象为函数 f(x) 在 x0 处的导数定义
- 明确核心思想：强调"极限"是理解导数定义的关键
- 给出具体计算例：求 f(x)=x² 在 x=1 处的导数，逐步展开化简
- 总结几何意义：将导数与函数曲线在某点切线的斜率联系起来
teacher_actions:
- explain（讲解导数定义与极限思想）
- demonstrate（演示从平均速度到瞬时速度的推导过程）
- scaffold（通过物理例子为抽象数学定义搭建脚手架）
- summarize（点明极限思想是核心，并总结几何意义）
student_signals:
- 学生跟随老师完成从平均速度到瞬时速度的极限推导过程
- 学生能理解并复述极限定义 f'(x0)=lim[f(x0+h)-f(x0)]/h
- 学生能在具体例子（x²在x=1处）中完成代数化简计算
- 学生能将导数与切线斜率建立对应关系
failure_modes:
- 学生若对极限概念理解不足，无法理解"趋近于零"的本质含义，会导致形式化定义难以落地
- 物理例子（自由落体）若超出学生物理背景，可能增加额外认知负荷，偏离数学主线
- 从物理情境跳跃到抽象极限定义时跨度较大，部分学生可能跟不上隐含的数学化过程
- 几何意义（切线斜率）在最后才提及，缺乏与定义的显式对应，可能给学生造成"两个孤立结论"的印象
- 仅展示一个计算例子（x²在x=1处），缺乏变式练习，学生难以迁移到一般情形
verification:
- 让学生复述导数极限定义，要求准确写出lim表达式和每个符号的含义
- 给出f(x)=x^3，让学生在x=2处用极限定义计算导数
- 提问：如果极限不存在，导数存在吗？要求学生举例说明
source_video: 高等数学同济八版2.1导数概念（上）.mp4
source_course: 高等数学
source_timestamp: 0-300s
bloom_category: 理解
teaching_strategies:
- 类比或具体例子（用自由落体的瞬时速度作为物理类比）
- 先直觉后形式化（先讲平均→瞬时的直觉过程，再给出严格的极限定义）
- 逐步拆解（将求导过程拆为代入、展开、化简、求极限等步骤）
- 从具体到抽象（从物理实例 → 数学定义 → 代数计算 → 几何解释）
- 对比学习（平均速度 vs 瞬时速度，形成认知冲突以引出极限）
courses: [高等数学]
