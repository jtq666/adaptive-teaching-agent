teaching_strategies:
- 类比或具体例子：以牛顿第二定律在不同地点成立作为具体例子来说明抽象概念
- 先直觉后形式化：先用具体例子建立直觉，再用'空间平移对称性'给出形式化命名
- 知识回顾与联系：将新概念与已学的牛顿第二定律建立联系
- 总结与迁移：通过'普遍规律'的表述帮助学生将知识迁移到更广阔的物理图景
