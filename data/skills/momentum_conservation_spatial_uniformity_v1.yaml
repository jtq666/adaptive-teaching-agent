skill_id: momentum_conservation_spatial_uniformity_v1
name: 从空间均匀性理解动量守恒的物理根源
version: '1.0'
trigger:
- 学生初次接触理解空间均匀性（空间
- 学生对理解空间均匀性（空间感到困惑或难以理解
preconditions:
- 学生已掌握相关前置知识
- 学生具备基本的理解空间均匀性（空间相关概念
goal:
- 理解空间均匀性（空间平移对称性）的物理含义：相同物理实验在不同地点得到相同结果
- 建立空间均匀性与动量守恒定律之间的内在联系，认识动量守恒是空间均匀性的必然结果
- 形成对称性与守恒律对应的基本物理观念，理解自然界普遍规律的内在逻辑
- 认知目标层次：主要以布鲁姆分类中的'理解'和'应用'层面为主
procedure:
- 提出问题：过渡性提问'这段时间里他们又遵守什么样的物理规律呢'，引出本节主题
- 强调核心概念：明确提出'空间的均匀性'这一物理原理
- 给出直观例子：以牛顿第二定律在剑桥和青岛等不同地点同样成立为例，说明空间均匀性
- 给出形式化定义：将上述现象命名为'空间的均匀性'，并给出其等价表述'空间平移对称性'
- 建立概念联系：明确指出'动量守恒定律是空间均匀性的反应'
- 预告数学证明：提示可利用数学证明动量守恒是空间均匀性的必然结果
teacher_actions:
- prompt：通过过渡性提问引出本节主题，激发学生思考
- explain：讲解空间均匀性的含义及其与动量守恒的关系
- demonstrate：通过举出牛顿定律在剑桥和青岛均成立的例子进行演示说明
- summarize：总结动量守恒是空间均匀性的反映，归纳出普遍性结论
student_signals:
- 本段教学缺乏明确的学生理解检查信号
- 教师通过陈述'是自然界的普遍规律'暗示学生应建立普遍性认知
- 未设置提问、练习或学生复述等可观察的反馈环节
failure_modes:
- 缺乏数学推导过程：仅声称'只需利用数学就能证明'但未实际展示推导，学生难以真正理解必然性联系
- 缺少学生互动与理解检查：没有提问或练习环节，无法判断学生是否真正理解空间均匀性的含义
- 概念跳跃较大：从牛顿第二定律直接跳跃到'动量守恒是空间均匀性的反应'，缺少中间推导环节
- 前置知识要求较高：需要学生已具备对称性、平移变换等数学基础，对部分学生可能门槛过高
- 例子过于单一：仅以牛顿第二定律为例，对于'空间均匀性'的说明可能不够充分
verification:
- 请学生用自己的话解释理解空间均匀性（空间
- 出一道相关的应用题检验理解
- 设计一道理解层级的问题
