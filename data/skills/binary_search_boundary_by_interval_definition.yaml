teaching_strategies:
- 类比或具体例子：用具体数值（如left=right=1）验证区间合法性
- 逐步拆解：将二分法代码逐行拆解，每一步都结合区间定义解释
- 对比学习：左闭右闭与左闭右开两个版本进行对比，突出边界处理差异
- 先直觉后形式化：先指出常见困惑，再引入区间定义作为理论依据
- 提问与等待：通过'灵魂考问'式提问引导思考边界条件
- 根据学生反应动态调整：针对常见的'写middle也能过'的疑问进行专门解释
- 总结与迁移：总结区间定义决定边界写法的原则，引导到LeetCode练习
