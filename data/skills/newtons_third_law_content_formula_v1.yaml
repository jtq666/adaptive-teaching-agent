skill_id: newtons_third_law_content_formula_v1
name: 牛顿第三定律的内容、公式与跨课程衔接
version: '1.0'
trigger:
- 学生初次接触记忆：记住牛顿第三定
- 学生对记忆：记住牛顿第三定感到困惑或难以理解
preconditions:
- 学生已掌握相关前置知识
- 学生具备基本的记忆：记住牛顿第三定相关概念
goal:
- 记忆：记住牛顿第三定律的内容并能用数学式 F1R = -F21 表达【记忆】
- 理解：理解牛顿第三定律的使用前提是"超距作用"假说【理解】
- 分析：能分析牛顿第三定律在远距离/电磁学场景下为何可能失效【分析】
- 应用：能在经典力学（引力、接触力）的典型场景中正确应用牛顿第三定律【应用】
procedure:
- 陈述牛顿第三定律的核心内容（作用力与反作用力大小相等方向相反）
- 给出简洁数学表达式 F1R = -F21，并解释两力可视为互相等价并抵消
- 引出牛顿第三定律的使用前提——"超距作用"假说
- 补充历史背景：牛顿本人反对超距作用（通过信件体现），在当时是不得已的选择
- 进入法拉第年代，介绍"场"概念的引入，说明相互作用传播需要时间
- 给出传播时间的定量估计：距离 / 光速（最小值）
- 用两个物体的具体例子说明：当一物体运动时，另一物体感受到力变化存在延迟，从而第三定律在此场景下失效
- 回归本课程语境：引力（牛顿严格形式）满足第三定律；接触力因已接触，传播无需时间，故可放心使用
- 迁移提示：在电磁学等其他课程中第三定律不再适用，只需把力的形式准确代入即可
teacher_actions:
- explain（讲解第三定律内容、数学表达式、使用前提）
- demonstrate（用两个物体的示例演示传播延迟导致的失效场景）
- scaffold（铺设历史背景：从超距作用→法拉第力场→光速传播）
- contrast（对比经典力学场景与电磁学场景下第三定律的适用性）
- summarize（总结本课程中为何可以放心使用牛顿第三定律）
student_signals:
- 学生能否跟随两个物体的示例推断出"反应延迟"的结论
- 学生能否复述牛顿第三定律的内容与表达式 F1R = -F21
- 学生能否区分本课程（经典力学）与电磁学中牛顿第三定律的适用性
- 学生能否理解超距作用这一历史假说及其被场概念取代的原因
failure_modes:
- 超距作用概念抽象且来自历史，学生可能难以理解其物理含义
- 历史背景内容较多（牛顿立场、法拉第引入力场），可能偏离主题使学生注意力分散
- 未给出明确的可操作判据来判定何时使用牛顿第三定律，导致学生迁移困难
- 缺少课堂练习与反馈环节，学生无法检验自己是否真正理解适用前提
- 学生若缺乏对引力（如万有引力定律）和接触力的前置理解，可能无法理解"放心使用"的含义
verification:
- 请学生用自己的话解释记忆：记住牛顿第三定
- 出一道相关的应用题检验理解
- 设计一道理解层级的问题
