teaching_strategies:
- 先直觉后形式化：先以文字陈述定律内容，再给出简洁数学式 F1R = -F21
- 类比或具体例子：用两个相隔一定距离的物体相互作用的例子说明延迟效应
- 知识回顾与间隔复习：联系前期所学力的概念（引力、接触力），并将本节与未来电磁学课程做衔接
- 对比学习：对比经典力学场景（满足）与电磁学场景（不满足），对比牛顿时代与法拉第时代的认知
- 总结与迁移：在结尾归纳本课程适用范围，并提示跨课程的迁移方法
- 历史情境化教学：通过历史脉络（超距作用→场的概念）帮助学生理解定律的成立条件
